{% extends "base.html" %}
{% block title %}Sign In | FlapGuard AI{% endblock %}
{% block content %}
<div class="card auth-box">
  <div class="auth-brand">
    <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="FlapGuard AI">
    <h2>Clinician Sign In</h2>
    <p class="muted" style="margin:0;">Postoperative Free-Flap Perfusion &amp; Early Vascular Compromise Monitoring</p>
  </div>
  <form method="POST" action="{{ url_for('main.login') }}" id="login-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="login-email">Hospital Email</label>
      <input id="login-email" name="email" type="email" required placeholder="clinician@hospital.org" autocomplete="email">
    </div>
    <div class="form-group">
      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password" required placeholder="Enter password" autocomplete="current-password">
    </div>
    <button id="login-submit" type="submit" class="btn" style="width:100%;margin-top:4px;">Sign In</button>
  </form>
  <p class="muted" style="margin-top:18px;text-align:center;">
    New clinician? <a id="goto-register" href="{{ url_for('main.register') }}">Create an account</a>
  </p>
</div>
{% endblock %}
