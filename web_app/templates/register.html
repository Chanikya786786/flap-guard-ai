{% extends "base.html" %}
{% block title %}Sign Up | FlapGuard AI{% endblock %}
{% block content %}
<div class="card auth-box">
  <h2>Create Clinician Account</h2>
  <form method="POST" action="{{ url_for('main.register') }}" id="register-form">
    <div class="form-group">
      <label for="reg-name">Full Name</label>
      <input id="reg-name" name="full_name" type="text" required placeholder="Dr. Your Name">
    </div>
    <div class="form-group">
      <label for="reg-email">Email Address</label>
      <input id="reg-email" name="email" type="email" required placeholder="doctor@hospital.org">
    </div>
    <div class="form-group">
      <label for="reg-role">Clinical Role</label>
      <select id="reg-role" name="role">
        <option value="Surgeon">Surgeon</option>
        <option value="Nurse">Nurse</option>
        <option value="Resident">Resident</option>
        <option value="Admin">Admin</option>
      </select>
    </div>
    <div class="form-group">
      <label for="reg-password">Password (min 8 characters)</label>
      <input id="reg-password" name="password" type="password" minlength="8" required>
    </div>
    <div class="form-group">
      <label for="reg-confirm">Confirm Password</label>
      <input id="reg-confirm" name="confirm_password" type="password" minlength="8" required>
    </div>
    <button id="register-submit" type="submit" class="btn" style="width:100%;">Create Account</button>
  </form>
  <p class="muted" style="margin-top:14px;">
    Already registered? <a href="{{ url_for('main.login') }}">Sign in</a>
  </p>
</div>
{% endblock %}
