{% extends "base.html" %}
{% block title %}Sign Up | FlapGuard AI{% endblock %}
{% block content %}
<div class="card auth-box">
  <div class="auth-brand">
    <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="FlapGuard AI">
    <h2>Create Clinician Account</h2>
    <p class="muted" style="margin:0;">Join your surgical ward monitoring workspace</p>
  </div>
  <form method="POST" action="{{ url_for('main.register') }}" id="register-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="reg-name">Full Name</label>
      <input id="reg-name" name="full_name" type="text" required placeholder="Dr. Full Name">
    </div>
    <div class="form-group">
      <label for="reg-email">Hospital Email</label>
      <input id="reg-email" name="email" type="email" required placeholder="clinician@hospital.org">
    </div>
    <div class="form-group">
      <label for="reg-role">Clinical Role</label>
      <select id="reg-role" name="role">
        <option value="Surgeon">Surgeon</option>
        <option value="Nurse">Nurse</option>
        <option value="Resident">Resident</option>
        <option value="Admin">Admin</option>
      </select>
    </div>
    <div class="form-group">
      <label for="reg-password">Password (min 8 characters)</label>
      <input id="reg-password" name="password" type="password" minlength="8" required placeholder="Create password">
    </div>
    <div class="form-group">
      <label for="reg-confirm">Confirm Password</label>
      <input id="reg-confirm" name="confirm_password" type="password" minlength="8" required placeholder="Re-enter password">
    </div>
        {% if invite_required %}
    <div class="form-group">
      <label for="reg-invite">Hospital Invite Code</label>
      <input id="reg-invite" name="invite_code" type="text" required placeholder="Enter hospital onboarding code">
    </div>
    {% endif %}
    <button id="register-submit" type="submit" class="btn" style="width:100%;margin-top:4px;">Create Account</button>
  </form>
  <p class="muted" style="margin-top:18px;text-align:center;">
    Already registered? <a href="{{ url_for('main.login') }}">Sign in</a>
  </p>
</div>
{% endblock %}
