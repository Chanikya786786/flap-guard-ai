name: FlapGuard AI - Full End-to-End CI & 7 Excel Test Reports

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  web-and-core-tests:
    name: Core, Security, Load & Selenium Web Tests (6 Reports)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Unit Test Suite (325+ rows)
        run: python -m tests.test_unit_suite

      - name: Run Validation Test Suite (326+ rows)
        run: python -m tests.test_validation_suite

      - name: Run Deployment Test Suite (325+ rows)
        run: python -m tests.test_deployment_suite

      - name: Run Load Test Suite (320+ rows)
        run: python -m tests.test_load_suite

      - name: Run Vulnerability Test Suite (325+ rows)
        run: python -m tests.test_vulnerability_suite

      - name: Run Selenium Web Test Suite (330+ rows)
        run: python -m tests.test_selenium_web_suite

      - name: Audit 6 Web & Core Excel Reports
        run: python -m tests.run_all_tests --skip-appium --verify-only

      - name: Upload 6 Web & Core Excel Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-and-core-reports
          path: reports/*.xlsx

  android-appium-tests:
    name: Android APK Build & Appium Mobile Tests (335+ rows)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (for Gradle 9)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Build Android Debug APK
        run: |
          chmod +x mobile_app/gradlew
          cd mobile_app
          ./gradlew assembleDebug --no-daemon

      - name: Upload Built Android APK
        uses: actions/upload-artifact@v4
        with:
          name: flapguard-android-apk
          path: mobile_app/app/build/outputs/apk/debug/app-debug.apk

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Set up Node.js & Appium UiAutomator2
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Appium & Android Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android Emulator & Run Appium Suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python -m tests.test_appium_android_suite

      - name: Upload Appium Android Excel Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-android-report
          path: reports/appium-android-report.xlsx

  verify-all-7-reports:
    name: Final Audit & Bundle All 7 Excel Reports
    needs: [ web-and-core-tests, android-appium-tests ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies for audit
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Download 6 Web & Core Reports
        uses: actions/download-artifact@v4
        with:
          name: web-and-core-reports
          path: reports

      - name: Download Appium Android Report
        uses: actions/download-artifact@v4
        with:
          name: appium-android-report
          path: reports

      - name: Verify All 7 Reports Have 300+ Rows & 100% Pass
        run: python -m tests.run_all_tests --verify-only

      - name: Upload Complete Bundle (All 7 Excel Reports)
        uses: actions/upload-artifact@v4
        with:
          name: all-7-test-reports
          path: reports/*.xlsx